<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TITLE_PLACEHOLDER</title>
    <link href="FONT_AWWSOME_CSS_URI_PLACEHOLDER" rel="stylesheet">

    <!-- Fix font-awesome font paths for webview -->
    <style>
        @font-face {
            font-family: 'FontAwesome';
            src: url('FONT_AWESOME_WOFF2_URI_PLACEHOLDER') format('woff2'),
                 url('FONT_AWESOME_WOFF_URI_PLACEHOLDER') format('woff'),
                 url('FONT_AWESOME_TTF_URI_PLACEHOLDER') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
    </style>

    <script src="CYTOSCAPE_URI_PLACEHOLDER"></script>
    <!-- Note: Dagre layout calculation is now performed on extension side (Node.js) -->
    <!-- Webview uses 'preset' layout with pre-calculated positions -->

    <!-- Data passed from extension to webview -->
    <script>
        // Global variables for the graph script
        window.GRAPH_ELEMENTS = ELEMENTS_PLACEHOLDER;
        window.GRAPH_NODES_COUNT = ELEMENTS_NODES_LENGTH_PLACEHOLDER;
        window.GRAPH_EDGES_COUNT = ELEMENTS_EDGES_LENGTH_PLACEHOLDER;
        window.IS_STANDALONE = IS_STANDALONE_PLACEHOLDER;
        window.GRAPH_DATA_JS_URI = "GRAPH_DATA_JS_URI_PLACEHOLDER";
        window.WORKSPACE_NAME = "WORKSPACE_NAME_PLACEHOLDER";
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: BACKGROUND_COLOR_PLACEHOLDER;
            overflow: hidden;
        }

        /* プログレスバー */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: PROGRESS_BG_COLOR_PLACEHOLDER;
            z-index: 2000;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #007ACC, #4A90E2);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 0 2px 2px 0;
        }
        #progress-text {
            position: fixed;
            top: 8px;
            left: 10px;
            color: CONTROLS_COLOR_PLACEHOLDER;
            font-size: 12px;
            z-index: 2001;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* ビューコンテナ（シングルビュー） */
        .view-container {
            width: 100%;
            height: 100vh;
            background-color: BACKGROUND_COLOR_PLACEHOLDER;
            padding-top: 0;
        }
        .view-container.active {
            display: block;
        }
        .cy-container {
            width: 100%;
            height: 100%;
        }

        /* コントロールパネル */
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: CONTROLS_BG_PLACEHOLDER;
            color: CONTROLS_COLOR_PLACEHOLDER;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 2px 4px BOX_SHADOW_COLOR_PLACEHOLDER;
            border: BORDER_STYLE_PLACEHOLDER;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .button-row {
            display: flex;
            flex-direction: row;
            gap: 5px;
            margin: 2px 0;
        }
        button {
            margin: 0;
            padding: 8px 12px;
            border: none;
            border-radius: 3px;
            background: BUTTON_NO_POINT_BG_PLACEHOLDER;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            min-width: auto;
        }
        button:hover {
            background: BUTTON_HOVER_BG_PLACEHOLDER;
        }
        button i.codicon {
            font-size: 16px;
        }
        button span {
            font-weight: normal;
        }
        .node-level-selector {
            margin: 2px 0;
            padding: 6px 6px;
            border: none;
            border-radius: 3px;
            background: BUTTON_NO_POINT_BG_PLACEHOLDER;
            color: white;
            font-size: 13px;
            cursor: pointer;
            width: 120px;
        }
        .node-level-selector:hover {
            background: BUTTON_HOVER_BG_PLACEHOLDER;
        }
        .node-level-selector:focus {
            outline: none;
            border-color: #007ACC;
        }
    </style>
</head>
<body>
    <!-- プログレスバー -->
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <h2 id="progress-text">Loading...</h2>

    <!-- グラフビュー -->
    <div id="view-graph" class="view-container active">
        <div class="controls">
            <div class="button-row">
                <button onclick="fitGraph()" title="Fit to Screen">
                    <i class="icon fa fa-expand" aria-hidden="true"></i>
                </button>
                <button onclick="resetLayout()" title="Reset Layout">
                    <i class="fa fa-refresh" aria-hidden="true"></i>
                </button>
                EXPORT_BUTTON_PLACEHOLDER
            </div>
            <select id="node-level" class="node-level-selector" onchange="changeNodeLevel(this.value)">
                <option value="dir-only">Directory Only</option>
                <option value="dir-file">Directory + File</option>
                <option value="file-only">File Only</option>
                <option value="file-symbol" selected>File + Symbol</option>
            </select>
        </div>
        <div id="cy-graph" class="cy-container"></div>
    </div>

    <!-- Main script -->
    GRAPH_SCRIPT_URI_PLACEHOLDER
</body>
</html>
