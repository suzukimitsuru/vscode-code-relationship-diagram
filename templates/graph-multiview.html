<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TITLE_PLACEHOLDER</title>
    <link href="FONT_AWWSOME_CSS_URI_PLACEHOLDER" rel="stylesheet">

    <!-- Fix font-awesome font paths for webview -->
    <style>
        @font-face {
            font-family: 'FontAwesome';
            src: url('FONT_AWESOME_WOFF2_URI_PLACEHOLDER') format('woff2'),
                 url('FONT_AWESOME_WOFF_URI_PLACEHOLDER') format('woff'),
                 url('FONT_AWESOME_TTF_URI_PLACEHOLDER') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
    </style>

    <script src="CYTOSCAPE_URI_PLACEHOLDER"></script>
    <script src="PLAIN_DAGRE_URI_PLACEHOLDER"></script>
    <script src="CYTOSCAPE_DAGRE_URI_PLACEHOLDER"></script>

    <!-- Data passed from extension to webview -->
    <script>
        // Global variables for the graph script
        window.GRAPH_ELEMENTS = ELEMENTS_PLACEHOLDER;
        window.GRAPH_NODES_COUNT = ELEMENTS_NODES_LENGTH_PLACEHOLDER;
        window.GRAPH_EDGES_COUNT = ELEMENTS_EDGES_LENGTH_PLACEHOLDER;
        window.IS_STANDALONE = IS_STANDALONE_PLACEHOLDER;
        window.GRAPH_DATA_JS_URI = "GRAPH_DATA_JS_URI_PLACEHOLDER";
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: BACKGROUND_COLOR_PLACEHOLDER;
            overflow: hidden;
        }

        /* プログレスバー */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: PROGRESS_BG_COLOR_PLACEHOLDER;
            z-index: 2000;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #007ACC, #4A90E2);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 0 2px 2px 0;
        }
        #progress-text {
            position: fixed;
            top: 8px;
            left: 10px;
            color: CONTROLS_COLOR_PLACEHOLDER;
            font-size: 12px;
            z-index: 2001;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* タブナビゲーション */
        .tab-navigation {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1500;
            background: CONTROLS_BG_PLACEHOLDER;
            border-radius: 5px;
            box-shadow: 0 2px 4px BOX_SHADOW_COLOR_PLACEHOLDER;
            border: BORDER_STYLE_PLACEHOLDER;
            display: flex;
            overflow: hidden;
        }
        .tab-button {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: CONTROLS_COLOR_PLACEHOLDER;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: BORDER_STYLE_PLACEHOLDER;
            min-width: 150px;
            justify-content: center;
        }
        .tab-button:last-child {
            border-right: none;
        }
        .tab-button:hover {
            background: BUTTON_HOVER_BG_PLACEHOLDER;
            color: white;
        }
        .tab-button.active {
            background: BUTTON_NO_POINT_BG_PLACEHOLDER;
            color: white;
            font-weight: bold;
        }
        .tab-button i {
            font-size: 16px;
        }

        /* ビューコンテナ */
        .view-container {
            width: 100%;
            height: 100vh;
            background-color: BACKGROUND_COLOR_PLACEHOLDER;
            padding-top: 60px;
            display: none;
        }
        .view-container.active {
            display: block;
        }
        .cy-container {
            width: 100%;
            height: 100%;
        }

        /* コントロールパネル */
        .controls {
            position: absolute;
            top: 70px;
            left: 10px;
            z-index: 1000;
            background: CONTROLS_BG_PLACEHOLDER;
            color: CONTROLS_COLOR_PLACEHOLDER;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 4px BOX_SHADOW_COLOR_PLACEHOLDER;
            border: BORDER_STYLE_PLACEHOLDER;
        }
        button {
            margin: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 3px;
            background: BUTTON_NO_POINT_BG_PLACEHOLDER;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            min-width: auto;
        }
        button:hover {
            background: BUTTON_HOVER_BG_PLACEHOLDER;
        }
        button i.codicon {
            font-size: 16px;
        }
        button span {
            font-weight: normal;
        }
        .export-dropdown {
            position: relative;
            display: inline-flex;
            margin: 5px;
        }
        .export-main {
            border-radius: 3px 0 0 3px;
            margin: 0;
        }
        .export-toggle {
            border-radius: 0 3px 3px 0;
            border-left: 1px solid BUTTON_HOVER_BG_PLACEHOLDER;
            margin: 0;
            padding: 8px 6px;
            min-width: auto;
        }
        .export-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: CONTROLS_BG_PLACEHOLDER;
            border: BORDER_STYLE_PLACEHOLDER;
            border-radius: 3px;
            box-shadow: 0 4px 8px BOX_SHADOW_COLOR_PLACEHOLDER;
            min-width: 120px;
            z-index: 1001;
            display: none;
            flex-direction: column;
            padding: 4px 0;
        }
        .export-menu.show {
            display: flex;
        }
        .export-menu button {
            margin: 0;
            padding: 8px 12px;
            background: transparent;
            color: CONTROLS_COLOR_PLACEHOLDER;
            border-radius: 0;
            justify-content: flex-start;
            text-align: left;
            border: none;
        }
        .export-menu button:hover {
            background: BUTTON_HOVER_BG_PLACEHOLDER;
        }
        .export-menu button i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <!-- プログレスバー -->
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <h2 id="progress-text">Loading...</h2>

    <!-- タブナビゲーション -->
    <div class="tab-navigation">
        <button class="tab-button active" data-view="file-deps">
            <i class="fa fa-file-code-o" aria-hidden="true"></i>
            <span>File Dependencies</span>
        </button>
        <button class="tab-button" data-view="hierarchy">
            <i class="fa fa-sitemap" aria-hidden="true"></i>
            <span>Hierarchy</span>
        </button>
        <button class="tab-button" data-view="call-graph">
            <i class="fa fa-share-alt" aria-hidden="true"></i>
            <span>Call Graph</span>
        </button>
    </div>

    <!-- ビュー1: ファイル依存関係 -->
    <div id="view-file-deps" class="view-container active">
        <div class="controls">
            <button onclick="fitGraph('file-deps')" title="Fit to Screen">
                <i class="icon fa fa-expand" aria-hidden="true"></i>
            </button>
            <button onclick="resetLayout('file-deps')" title="Reset Layout">
                <i class="fa fa-refresh" aria-hidden="true"></i>
            </button>
            <button onclick="toggleDirectoryGroups('file-deps')" title="Toggle Directory Grouping">
                <i class="fa fa-folder" aria-hidden="true"></i>
                <span id="dir-label-file-deps">Dir: OFF</span>
            </button>
            EXPORT_BUTTON_FILE_DEPS_PLACEHOLDER
        </div>
        <div id="cy-file-deps" class="cy-container"></div>
    </div>

    <!-- ビュー2: 階層構造 -->
    <div id="view-hierarchy" class="view-container">
        <div class="controls">
            <button onclick="fitGraph('hierarchy')" title="Fit to Screen">
                <i class="icon fa fa-expand" aria-hidden="true"></i>
            </button>
            <button onclick="resetLayout('hierarchy')" title="Reset Layout">
                <i class="fa fa-refresh" aria-hidden="true"></i>
            </button>
            <button onclick="toggleDirectoryGroups('hierarchy')" title="Toggle Directory Grouping">
                <i class="fa fa-folder" aria-hidden="true"></i>
                <span id="dir-label-hierarchy">Dir: OFF</span>
            </button>
            <button onclick="expandAll()" title="Expand All">
                <i class="fa fa-plus-square-o" aria-hidden="true"></i>
            </button>
            <button onclick="collapseAll()" title="Collapse All">
                <i class="fa fa-minus-square-o" aria-hidden="true"></i>
            </button>
            EXPORT_BUTTON_HIERARCHY_PLACEHOLDER
        </div>
        <div id="cy-hierarchy" class="cy-container"></div>
    </div>

    <!-- ビュー3: 呼び出しグラフ -->
    <div id="view-call-graph" class="view-container">
        <div class="controls">
            <button onclick="fitGraph('call-graph')" title="Fit to Screen">
                <i class="icon fa fa-expand" aria-hidden="true"></i>
            </button>
            <button onclick="resetLayout('call-graph')" title="Reset Layout">
                <i class="fa fa-refresh" aria-hidden="true"></i>
            </button>
            <button onclick="toggleDirectoryGroups('call-graph')" title="Toggle Directory Grouping">
                <i class="fa fa-folder" aria-hidden="true"></i>
                <span id="dir-label-call-graph">Dir: OFF</span>
            </button>
            <button onclick="toggleOrientation()" title="Toggle Orientation">
                <i class="fa fa-rotate-right" aria-hidden="true"></i>
                <span id="orientation-label">Horizontal</span>
            </button>
            EXPORT_BUTTON_CALL_GRAPH_PLACEHOLDER
        </div>
        <div id="cy-call-graph" class="cy-container"></div>
    </div>

    <!-- Main script -->
    GRAPH_MULTIVIEW_SCRIPT_URI_PLACEHOLDER
</body>
</html>
