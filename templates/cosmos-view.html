<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TITLE_PLACEHOLDER</title>
    <link href="FONT_AWWSOME_CSS_URI_PLACEHOLDER" rel="stylesheet">

    <!-- Fix font-awesome font paths for webview -->
    <style>
        @font-face {
            font-family: 'FontAwesome';
            src: url('FONT_AWESOME_WOFF2_URI_PLACEHOLDER') format('woff2'),
                 url('FONT_AWESOME_WOFF_URI_PLACEHOLDER') format('woff'),
                 url('FONT_AWESOME_TTF_URI_PLACEHOLDER') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
    </style>

    <!-- Cosmos.gl (WebGL graph renderer) -->
    <script src="COSMOS_URI_PLACEHOLDER"></script>

    <!-- Data passed from extension to webview -->
    <script>
        // Global variables for the graph script
        window.GRAPH_NODES_COUNT = NODES_COUNT_PLACEHOLDER;
        window.GRAPH_LINKS_COUNT = LINKS_COUNT_PLACEHOLDER;
        window.IS_STANDALONE = IS_STANDALONE_PLACEHOLDER;
        window.GRAPH_DATA_JS_URI = "GRAPH_DATA_JS_URI_PLACEHOLDER";
        window.WORKSPACE_NAME = "WORKSPACE_NAME_PLACEHOLDER";
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: BACKGROUND_COLOR_PLACEHOLDER;
            overflow: hidden;
        }

        /* Progress bar */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: PROGRESS_BG_COLOR_PLACEHOLDER;
            z-index: 2000;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #007ACC, #4A90E2);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 0 2px 2px 0;
        }
        #progress-text {
            position: fixed;
            top: 8px;
            left: 10px;
            color: CONTROLS_COLOR_PLACEHOLDER;
            font-size: 12px;
            z-index: 2001;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* Graph container */
        #graph-container {
            width: 100%;
            height: 100vh;
            background-color: BACKGROUND_COLOR_PLACEHOLDER;
        }
        #graph-container canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Control panel */
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: CONTROLS_BG_PLACEHOLDER;
            color: CONTROLS_COLOR_PLACEHOLDER;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 2px 4px BOX_SHADOW_COLOR_PLACEHOLDER;
            border: BORDER_STYLE_PLACEHOLDER;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }
        .button-row {
            display: flex;
            flex-direction: row;
            gap: 5px;
        }
        button {
            margin: 0;
            padding: 8px 12px;
            border: none;
            border-radius: 3px;
            background: BUTTON_NO_POINT_BG_PLACEHOLDER;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        button:hover {
            background: BUTTON_HOVER_BG_PLACEHOLDER;
        }
        button i {
            font-size: 14px;
        }

        /* Node level selector */
        .node-level-selector {
            padding: 6px 8px;
            border: none;
            border-radius: 3px;
            background: BUTTON_NO_POINT_BG_PLACEHOLDER;
            color: white;
            font-size: 13px;
            cursor: pointer;
            width: 140px;
        }
        .node-level-selector:hover {
            background: BUTTON_HOVER_BG_PLACEHOLDER;
        }
        .node-level-selector:focus {
            outline: none;
            border-color: #007ACC;
        }

        /* Directory panel */
        .directory-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: CONTROLS_BG_PLACEHOLDER;
            color: CONTROLS_COLOR_PLACEHOLDER;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 2px 4px BOX_SHADOW_COLOR_PLACEHOLDER;
            border: BORDER_STYLE_PLACEHOLDER;
            max-height: 60vh;
            overflow-y: auto;
            min-width: 200px;
        }
        .directory-panel h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            border-bottom: BORDER_STYLE_PLACEHOLDER;
            padding-bottom: 4px;
        }
        .directory-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 0;
            font-size: 12px;
        }
        .directory-item input[type="checkbox"] {
            cursor: pointer;
        }
        .directory-item label {
            cursor: pointer;
            word-break: break-all;
        }

        /* Zoom controls */
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 120px;
            margin-top: 4px;
            padding-top: 4px;
            border-top: BORDER_STYLE_PLACEHOLDER;
        }
        .zoom-controls button {
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .zoom-slider {
            flex: 1;
            min-width: 60px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: PROGRESS_BG_COLOR_PLACEHOLDER;
            border-radius: 3px;
            outline: none;
        }
        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: BUTTON_NO_POINT_BG_PLACEHOLDER;
            border-radius: 50%;
            cursor: pointer;
        }
        .zoom-level {
            font-size: 11px;
            min-width: 40px;
            text-align: center;
        }

        /* Tooltip - Phase 3 Enhanced */
        .cosmos-tooltip {
            position: absolute;
            display: none;
            background: CONTROLS_BG_PLACEHOLDER;
            border: BORDER_STYLE_PLACEHOLDER;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 12px;
            color: CONTROLS_COLOR_PLACEHOLDER;
            max-width: 350px;
            z-index: 1000;
            pointer-events: auto;
            box-shadow: 0 4px 12px BOX_SHADOW_COLOR_PLACEHOLDER;
        }
        .cosmos-tooltip .tooltip-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .cosmos-tooltip .tooltip-icon {
            font-size: 16px;
        }
        .cosmos-tooltip .tooltip-path {
            color: #888;
            font-size: 11px;
            word-break: break-all;
            margin-bottom: 4px;
        }
        .cosmos-tooltip .tooltip-info {
            color: #aaa;
            font-size: 11px;
        }
        .cosmos-tooltip .tooltip-connections {
            margin-top: 6px;
            padding-top: 6px;
        }
        .cosmos-tooltip .tooltip-section {
            margin-top: 6px;
        }
        .cosmos-tooltip .tooltip-label {
            display: block;
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .cosmos-tooltip .tooltip-link {
            display: flex;
            flex-direction: column;
            color: #4A90E2;
            text-decoration: none;
            padding: 4px 6px;
            margin: 2px 0;
            border-radius: 3px;
            background: rgba(74, 144, 226, 0.1);
            transition: background 0.15s ease;
        }
        .cosmos-tooltip .tooltip-link:hover {
            background: rgba(74, 144, 226, 0.25);
            text-decoration: none;
        }
        .cosmos-tooltip .tooltip-outgoing {
            border-left: 2px solid #4A90E2;
        }
        .cosmos-tooltip .tooltip-incoming {
            border-left: 2px solid #7CB342;
        }
        .cosmos-tooltip .tooltip-location {
            font-size: 10px;
            color: #888;
            margin-top: 2px;
        }
        .cosmos-tooltip .tooltip-more {
            display: block;
            color: #666;
            font-size: 11px;
            font-style: italic;
            margin-top: 4px;
        }
        .cosmos-tooltip hr {
            margin: 6px 0;
            border: none;
            border-top: BORDER_STYLE_PLACEHOLDER;
        }

        /* Statistics display */
        .stats-display {
            font-size: 11px;
            color: CONTROLS_COLOR_PLACEHOLDER;
            opacity: 0.8;
            padding: 4px 0;
        }
    </style>
</head>
<body>
    <!-- Progress bar -->
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <h2 id="progress-text">Loading...</h2>

    <!-- Control panel -->
    <div class="controls">
        <div class="button-row">
            <button id="btn-fit" title="Fit to Screen">
                <i class="fa fa-expand" aria-hidden="true"></i>
            </button>
            <button id="btn-reset" title="Reset View">
                <i class="fa fa-refresh" aria-hidden="true"></i>
            </button>
            EXPORT_BUTTON_PLACEHOLDER
        </div>
        <select id="node-level" class="node-level-selector">
            <option value="dir-only">Directory Only</option>
            <option value="dir-file">Directory + File</option>
            <option value="file-only" selected>File Only</option>
            <option value="file-symbol">File + Symbol</option>
        </select>
        <div class="zoom-controls">
            <button id="zoom-out-btn" title="Zoom Out">
                <i class="fa fa-minus" aria-hidden="true"></i>
            </button>
            <input type="range" class="zoom-slider" id="zoom-slider"
                   min="0.1" max="5" step="0.1" value="1">
            <button id="zoom-in-btn" title="Zoom In">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
            <span class="zoom-level" id="zoom-level">100%</span>
        </div>
        <div class="stats-display" id="stats-display">
            Nodes: 0 | Links: 0
        </div>
    </div>

    <!-- Directory visibility panel -->
    <div class="directory-panel" id="directory-panel" style="display: none;">
        <h3>Directories</h3>
        <div id="directory-list"></div>
    </div>

    <!-- Graph container (Cosmos.gl canvas will be added here) -->
    <div id="graph-container"></div>

    <!-- Tooltip (Phase 3) -->
    <div id="cosmos-tooltip" class="cosmos-tooltip"></div>

    <!-- Main script -->
    GRAPH_SCRIPT_URI_PLACEHOLDER
</body>
</html>
