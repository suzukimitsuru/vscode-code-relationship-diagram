<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TITLE_PLACEHOLDER</title>
    <link rel="stylesheet" href="CODICONS_CSS_URI_PLACEHOLDER">
    <script src="CYTOSCAPE_URI_PLACEHOLDER"></script>
    <script src="CYTOSCAPE_DAGRE_URI_PLACEHOLDER"></script>
    <style>
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: BACKGROUND_COLOR_PLACEHOLDER;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .loading-container.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid PROGRESS_BG_COLOR_PLACEHOLDER;
            border-top: 4px solid #007ACC;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: BACKGROUND_COLOR_PLACEHOLDER;
        }
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: PROGRESS_BG_COLOR_PLACEHOLDER;
            z-index: 2000;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #007ACC, #4A90E2);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 0 2px 2px 0;
        }
        #progress-text {
            position: fixed;
            top: 8px;
            left: 10px;
            color: CONTROLS_COLOR_PLACEHOLDER;
            font-size: 12px;
            z-index: 2001;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        #cy {
            width: 100%;
            height: 100vh;
            background-color: BACKGROUND_COLOR_PLACEHOLDER;
            padding-top: 4px;
        }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: CONTROLS_BG_PLACEHOLDER;
            color: CONTROLS_COLOR_PLACEHOLDER;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 4px BOX_SHADOW_COLOR_PLACEHOLDER;
            border: BORDER_STYLE_PLACEHOLDER;
        }
        button {
            margin: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 3px;
            background: BUTTON_BG_PLACEHOLDER;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            min-width: auto;
        }
        button:hover {
            background: BUTTON_HOVER_BG_PLACEHOLDER;
        }
        button i.codicon {
            font-size: 16px;
        }
        button span {
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <div id="progress-text">Loading...</div>
    <div class="controls">
        <button onclick="fitGraph()" title="Fit to Screen">
            <i class="codicon codicon-go-to-editing-session"></i>
        </button>
        <button onclick="resetLayout()" title="Reset Layout">
            <i class="codicon codicon-refresh"></i>
        </button>
        <button onclick="exportPNG()" title="Export PNG">
            <i class="codicon codicon-save-as"></i>
        </button>
    </div>
    <div id="cy"></div>
    <script>
        // 進捗表示の管理
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressContainer = document.getElementById('progress-container');

        function updateProgress(percent, message) {
            progressBar.style.width = percent + '%';
            progressText.textContent = message;

            if (percent >= 100) {
                setTimeout(() => {
                    progressContainer.style.opacity = '0';
                    progressText.style.opacity = '0';
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        progressText.style.display = 'none';
                    }, 300);
                }, 500);
            }
        }

        // VSCode Extension からのメッセージ受信
        window.addEventListener('message', event => {
            const message = event.data;
            if (message.type === 'progress') {
                updateProgress(message.percent, message.message);
            }
        });

        // 初期進捗表示
        updateProgress(10, 'Initializing graph...');
        console.log('Initializing Cytoscape.js with', ELEMENTS_NODES_LENGTH_PLACEHOLDER, 'nodes and', ELEMENTS_EDGES_LENGTH_PLACEHOLDER, 'edges');

        const cy = cytoscape({
            container: document.getElementById('cy'),
            elements: ELEMENTS_PLACEHOLDER,

            // ズーム制限を設定
            //minZoom: 0.1,
            //maxZoom: 3.0,
            wheelSensitivity: 1.0,

            // Compound graphsを有効にする
            // これにより親子関係のあるノードがグループ化される
            style: [
                {
                    selector: 'node',
                    style: {
                        'background-color': '#4A90E2',
                        'label': 'data(label)',
                        'text-valign': 'center',
                        'text-halign': 'center',
                        'color': '#fff',
                        'font-size': '14px',
                        'font-weight': 'bold',
                        'shape': 'rectangle',
                        'width': function( ele ) {
                            // ファイル名の長さとシンボル数に応じてサイズ調整（余裕を持たせる）
                            const labelLength = ele.data('label').length;
                            const symbolCount = ele.data('symbolCount') || 1;
                            return Math.max(140, labelLength * 9 + symbolCount * 3) + 'px';
                        },
                        'height': function( ele ) {
                            const symbolCount = ele.data('symbolCount') || 1;
                            return Math.max(70, 50 + symbolCount * 3) + 'px';
                        },
                        'text-wrap': 'wrap',
                        'text-max-width': function( ele ) {
                            const labelLength = ele.data('label').length;
                            return Math.max(100, labelLength * 8) + 'px';
                        },
                        'border-width': '2px',
                        'border-color': '#2E5984',
                        'background-opacity': 0.9
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'width': function( ele ) {
                            // 関係の多さに応じて線の太さを調整 (1-10の範囲)
                            const relationCount = ele.data('relationCount') || 1;
                            return Math.min(Math.max(relationCount * 0.8, 1), 10);
                        },
                        'line-color': function( ele ) {
                            // 関係の多さに応じて色の濃さを調整
                            const relationCount = ele.data('relationCount') || 1;
                            const intensity = Math.min(relationCount / 10, 1);
                            const red = Math.floor(71 + (231 - 71) * intensity);
                            const green = Math.floor(144 + (76 - 144) * intensity);
                            const blue = Math.floor(226 + (60 - 226) * intensity);
                            return `rgb(${red}, ${green}, ${blue})`;
                        },
                        'target-arrow-color': function( ele ) {
                            const relationCount = ele.data('relationCount') || 1;
                            const intensity = Math.min(relationCount / 10, 1);
                            const red = Math.floor(71 + (231 - 71) * intensity);
                            const green = Math.floor(144 + (76 - 144) * intensity);
                            const blue = Math.floor(226 + (60 - 226) * intensity);
                            return `rgb(${red}, ${green}, ${blue})`;
                        },
                        'target-arrow-shape': 'triangle',
                        'curve-style': 'bezier',
                        'opacity': function( ele ) {
                            const relationCount = ele.data('relationCount') || 1;
                            return Math.min(0.6 + relationCount * 0.04, 1.0);
                        }
                    }
                }
            ],
            layout: {
                name: 'cose',
                animate: true,
                animationDuration: 1500,
                fit: true,
                padding: 120,
                nodeRepulsion: function( node ) {
                    // シンボル数が多いファイルほど強い反発力（大幅に増加）
                    const symbolCount = node.data('symbolCount') || 1;
                    return Math.max(8000000, symbolCount * 3000000);
                },
                nodeOverlap: 100,
                idealEdgeLength: function( edge ) {
                    // 関係の多さに応じてエッジ長を調整（最小値を大きく）
                    const relationCount = edge.data('relationCount') || 1;
                    return Math.max(250, 450 - relationCount * 15);
                },
                edgeElasticity: function( edge ) {
                    // 関係が多いほど強い結合力
                    const relationCount = edge.data('relationCount') || 1;
                    return 80 + relationCount * 15;
                },
                gravity: 25,
                numIter: 2000,
                initialTemp: 200,
                coolingFactor: 0.95,
                minTemp: 1.0
            },
            zoomingEnabled: true,
            userZoomingEnabled: true,
            panningEnabled: true,
            userPanningEnabled: true,
            maxZoom: 3,
            minZoom: 0.1
        });

        let minZoomThreshold = 0.1;

        function updateMinZoom() {
            const bb = cy.elements().boundingBox();
            const containerWidth = cy.container().clientWidth;
            const containerHeight = cy.container().clientHeight;

            // コンテンツサイズとコンテナサイズの比率を計算
            const contentWidth = bb.w + 200; // パディングを追加
            const contentHeight = bb.h + 200;

            const widthRatio = containerWidth / contentWidth;
            const heightRatio = containerHeight / contentHeight;

            // 小さい方の比率を基準にして最小ズームを設定
            minZoomThreshold = Math.min(widthRatio, heightRatio, 0.1);

            // 最小ズーム値を適用（ただし0.05以下にはしない）
            const newMinZoom = Math.max(minZoomThreshold, 0.05);
            cy.minZoom(newMinZoom);

            console.log(`Updated minZoom: ${newMinZoom} (threshold: ${minZoomThreshold})`);
        }

        function fitGraph() {
            cy.fit();
            updateMinZoom();
        }

        function resetLayout() {
            const layout = cy.layout({
                name: 'cose',
                animate: true,
                animationDuration: 1500,
                fit: true,
                padding: 120,
                nodeRepulsion: function( node ) {
                    const symbolCount = node.data('symbolCount') || 1;
                    return Math.max(8000000, symbolCount * 3000000);
                },
                nodeOverlap: 100,
                idealEdgeLength: function( edge ) {
                    const relationCount = edge.data('relationCount') || 1;
                    return Math.max(250, 450 - relationCount * 15);
                },
                edgeElasticity: function( edge ) {
                    const relationCount = edge.data('relationCount') || 1;
                    return 80 + relationCount * 15;
                },
                gravity: 25,
                numIter: 2000,
                initialTemp: 200,
                coolingFactor: 0.95,
                minTemp: 1.0
            });
            layout.run();

            // レイアウト完了後にfitして最小ズームを更新
            layout.on('layoutstop', function() {
                setTimeout(() => {
                    fitGraph();
                }, 100);
            });
        }

        function exportPNG() {
            const png = cy.png({
                output: 'blob',
                bg: 'white',
                full: true
            });
            const link = document.createElement('a');
            link.download = 'code-relationship-diagram.png';
            link.href = URL.createObjectURL(png);
            link.click();
        }

        // VSCode API インスタンスを一度だけ取得
        const vscode = acquireVsCodeApi();

        // ツールチップ要素の作成
        const tooltip = document.createElement('div');
        tooltip.style.cssText = `
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            max-width: 300px;
            white-space: pre-wrap;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        `;
        document.body.appendChild(tooltip);

        // エッジのマウスホバー処理
        cy.on('mouseover', 'edge', function(evt) {
            const edge = evt.target;
            const relationCount = edge.data('relationCount') || 1;
            const referenceType = edge.data('referenceType') || 'unknown';
            const relationDetails = edge.data('relationDetails') || [];
            const sourceLabel = cy.getElementById(edge.data('source')).data('label');
            const targetLabel = cy.getElementById(edge.data('target')).data('label');

            let tooltipText = ``;

            // 詳細情報がある場合は表示 - toSymbolNameでグルーピング
            if (relationDetails.length > 0) {

                // toSymbolNameでグルーピング
                const groupedByTarget = new Map();
                relationDetails.forEach(detail => {
                    const targetSymbol = detail.toSymbolName;
                    if (!groupedByTarget.has(targetSymbol)) {
                        groupedByTarget.set(targetSymbol, []);
                    }
                    groupedByTarget.get(targetSymbol).push(detail.fromSymbolName);
                });

                // グルーピングした結果を表示（最大10個の対象シンボル）
                let displayCount = 0;
                for (const [targetSymbol, fromSymbols] of groupedByTarget) {
                    if (displayCount >= 10) break;

                    const uniqueFromSymbols = [...new Set(fromSymbols)]; // 重複を除去
                    tooltipText += `${targetSymbol}\n`;
                    for (const fromSymbol of uniqueFromSymbols) {
                        tooltipText += `  ${fromSymbol}\n`;
                    }
                    displayCount++;
                }

                if (groupedByTarget.size > 10) {
                    tooltipText += `  ... ${groupedByTarget.size} 件\n`;
                }
            }

            tooltip.textContent = tooltipText;
            tooltip.style.opacity = '1';
        });

        cy.on('mouseout', 'edge', function(evt) {
            tooltip.style.opacity = '0';
        });

        // マウス移動でツールチップ位置を更新
        cy.on('mousemove', function(evt) {
            if (tooltip.style.opacity === '1') {
                tooltip.style.left = (evt.originalEvent.pageX + 10) + 'px';
                tooltip.style.top = (evt.originalEvent.pageY - 10) + 'px';
            }
        });

        // ファイル開くための複数の方法を実装
        let clickTimer = null;
        let clickCount = 0;

        // 方法1: タイマーベースのダブルクリック判定（ドラッグ干渉回避）
        cy.on('tap', 'node', function(evt) {
            const node = evt.target;
            clickCount++;

            if (clickTimer) {
                clearTimeout(clickTimer);
            }

            clickTimer = setTimeout(() => {
                if (clickCount === 1) {
                    console.log('Node single clicked:', node.data());
                } else if (clickCount >= 2) {
                    // ダブルクリック処理
                    const filePath = node.data('path');
                    if (filePath) {
                        console.log('Node double-clicked (timer), opening file:', filePath);
                        vscode.postMessage({
                            type: 'openFile',
                            path: filePath
                        });
                    }
                }
                clickCount = 0;
            }, 300); // 300ms以内の連続クリックをダブルクリックと判定
        });

        // 方法2: 右クリックでファイルを開く
        cy.on('cxttap', 'node', function(evt) {
            const node = evt.target;
            const filePath = node.data('path');
            if (filePath) {
                console.log('Node right-clicked, opening file:', filePath);
                vscode.postMessage({
                    type: 'openFile',
                    path: filePath
                });
            }
        });

        // 方法3: Ctrl+クリックでファイルを開く
        cy.on('tap', 'node', function(evt) {
            if (evt.originalEvent && (evt.originalEvent.ctrlKey || evt.originalEvent.metaKey)) {
                const node = evt.target;
                const filePath = node.data('path');
                if (filePath) {
                    console.log('Node Ctrl+clicked, opening file:', filePath);
                    vscode.postMessage({
                        type: 'openFile',
                        path: filePath
                    });
                }
            }
        });
    </script>
</body>
</html>
