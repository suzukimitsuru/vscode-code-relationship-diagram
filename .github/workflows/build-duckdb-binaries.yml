name: Build duckdb.node for all platforms and Node.js versions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-duckdb-binaries.yml'
      - 'package.json'

jobs:
  build-matrix:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }} (Node.js ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false  # 1つのジョブが失敗しても他を継続
      max-parallel: 6   # 並行実行数を制限（macOS課金対策）
      matrix:
        include:
          # Linux x64 - 複数のNode.jsバージョン
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            node-version: 18
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            node-version: 20
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            node-version: 22
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            node-version: 23

          # macOS arm64 (Apple Silicon)
          - os: macos-14
            arch: arm64
            platform: darwin
            node-version: 18
          - os: macos-14
            arch: arm64
            platform: darwin
            node-version: 20
          - os: macos-14
            arch: arm64
            platform: darwin
            node-version: 22
          - os: macos-14
            arch: arm64
            platform: darwin
            node-version: 23

          # Windows x64
          # Note: DuckDB does not provide prebuilt binaries for Node.js 22/23 on Windows
          # and source builds fail with MSBuild errors. Only 18/20 are supported.
          - os: windows-2022
            arch: x64
            platform: win32
            node-version: 18
          - os: windows-2022
            arch: x64
            platform: win32
            node-version: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build DuckDB from source (Unix)
        if: runner.os != 'Windows'
        run: |
          npm install
          cd node_modules/duckdb
          npm run install --build-from-source

      - name: Install DuckDB with prebuilt binary (Windows)
        if: runner.os == 'Windows'
        run: |
          npm install
          cd node_modules\duckdb
          npm run install

      - name: Sign binary (macOS only)
        if: runner.os == 'macOS'
        run: |
          echo "Signing DuckDB binary with ad-hoc signature..."
          codesign -s - -f node_modules/duckdb/lib/binding/duckdb.node
          codesign -v node_modules/duckdb/lib/binding/duckdb.node

      - name: Copy and verify duckdb.node (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bindings
          cp node_modules/duckdb/lib/binding/duckdb.node bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node
          ls -lh bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node
          echo "Output: bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node"

      - name: Copy and verify duckdb.node (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path bindings
          Copy-Item node_modules\duckdb\lib\binding\duckdb.node bindings\duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node
          Get-Item bindings\duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node
          Write-Output "Output: bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node"

      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}
          path: bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node
          retention-days: 90
