name: Build duckdb.node for all platforms and Node.js versions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-duckdb-binaries.yml'
      - 'package.json'

jobs:
  build-matrix:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }} (Node.js ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # Linux x64 - 複数のNode.jsバージョン
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            node-version: 18
            abi: 108
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            node-version: 20
            abi: 115
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            node-version: 22
            abi: 127

          # macOS arm64 (Apple Silicon)
          - os: macos-14
            arch: arm64
            platform: darwin
            node-version: 18
            abi: 108
          - os: macos-14
            arch: arm64
            platform: darwin
            node-version: 20
            abi: 115
          - os: macos-14
            arch: arm64
            platform: darwin
            node-version: 22
            abi: 127

          # macOS x64 (Intel)
          - os: macos-13
            arch: x64
            platform: darwin
            node-version: 18
            abi: 108
          - os: macos-13
            arch: x64
            platform: darwin
            node-version: 20
            abi: 115
          - os: macos-13
            arch: x64
            platform: darwin
            node-version: 22
            abi: 127

          # Windows x64
          - os: windows-2022
            arch: x64
            platform: win32
            node-version: 18
            abi: 108
          - os: windows-2022
            arch: x64
            platform: win32
            node-version: 20
            abi: 115
          - os: windows-2022
            arch: x64
            platform: win32
            node-version: 22
            abi: 127

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Find duckdb.node (Unix)
        if: runner.os != 'Windows'
        run: find node_modules/duckdb/lib/binding -name "*.node"

      - name: Find duckdb.node (Windows)
        if: runner.os == 'Windows'
        run: Get-ChildItem -Recurse -Filter "duckdb*.node"

      - name: Copy duckdb.node with ABI version (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bindings
          cp node_modules/duckdb/lib/binding/duckdb.node bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-abi${{ matrix.abi }}.node
          echo "Built for Node.js ${{ matrix.node-version }} (ABI ${{ matrix.abi }})"
          echo "Output: bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-abi${{ matrix.abi }}.node"

      - name: Copy duckdb.node with ABI version (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir bindings
          copy node_modules\duckdb\lib\binding\duckdb.node bindings\duckdb-${{ matrix.platform }}-${{ matrix.arch }}-abi${{ matrix.abi }}.node
          echo "Built for Node.js ${{ matrix.node-version }} (ABI ${{ matrix.abi }})"
          echo "Output: bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-abi${{ matrix.abi }}.node"

      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-${{ matrix.platform }}-${{ matrix.arch }}-abi${{ matrix.abi }}
          path: bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-abi${{ matrix.abi }}.node
          retention-days: 90
