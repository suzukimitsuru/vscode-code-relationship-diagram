name: Build duckdb.node for all platforms and Node.js versions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-duckdb-binaries.yml'
      - 'package.json'

jobs:
  build-matrix:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }} (Node.js ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false  # 1つのジョブが失敗しても他を継続
      max-parallel: 6   # 並行実行数を制限（macOS課金対策）
      matrix:
        # Node.js はサポート中の 22（Maintenance LTS）/ 24（VS Code 1.10x の Electron が内蔵）/ 26（2026-10-28 から LTS）
        # duckdb は N-API（NAPI_VERSION=6）なので、拡張機能ホストの Node.js が古くても近いバージョンのバイナリで動く
        include:
          # Linux x64
          # 22.04 でビルドして glibc 2.35 以上の環境で動くようにする（24.04 だと glibc 2.39 以上が必要になる）
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            node-version: 22
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            node-version: 24
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            node-version: 26

          # macOS arm64 (Apple Silicon)
          # macos-14 は 2026-11-02 に廃止される。最低動作 OS は duckdb の binding.gyp の MACOSX_DEPLOYMENT_TARGET（10.15）で決まる
          - os: macos-15
            arch: arm64
            platform: darwin
            node-version: 22
          - os: macos-15
            arch: arm64
            platform: darwin
            node-version: 24
          - os: macos-15
            arch: arm64
            platform: darwin
            node-version: 26

          # Windows x64
          - os: windows-2025
            arch: x64
            platform: win32
            node-version: 22
          - os: windows-2025
            arch: x64
            platform: win32
            node-version: 24
          - os: windows-2025
            arch: x64
            platform: win32
            node-version: 26

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # npm 10.x は vitest@4 の optional peer の連鎖（vite → @vitejs/devtools → vitest@5）で
      # "Cannot read properties of null (reading 'edgesOut')" を出して落ちるため、npm 11 に上げる
      - name: Upgrade npm
        run: npm install -g npm@11

      # npm run 経由のビルドは npm 11 に同梱の node-gyp（12.x）を使うため、distutils の無い Python 3.12 以降でよい
      - name: Install Python (for node-gyp)
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build DuckDB from source (Unix)
        if: runner.os != 'Windows'
        run: |
          npm install
          cd node_modules/duckdb
          npm run install --build-from-source

      # 配布元にビルド済みのバイナリが無い Node.js のバージョンでは、ソースからのビルドに切り替わる
      - name: Install DuckDB with prebuilt binary or build from source (Windows)
        if: runner.os == 'Windows'
        run: |
          npm install
          cd node_modules\duckdb
          npm run install

      - name: Sign binary (macOS only)
        if: runner.os == 'macOS'
        run: |
          echo "Signing DuckDB binary with ad-hoc signature..."
          codesign -s - -f node_modules/duckdb/lib/binding/duckdb.node
          codesign -v node_modules/duckdb/lib/binding/duckdb.node

      - name: Copy and verify duckdb.node (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bindings
          cp node_modules/duckdb/lib/binding/duckdb.node bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node
          ls -lh bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node
          echo "Output: bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node"

      - name: Copy and verify duckdb.node (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path bindings
          Copy-Item node_modules\duckdb\lib\binding\duckdb.node bindings\duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node
          Get-Item bindings\duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node
          Write-Output "Output: bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node"

      - uses: actions/upload-artifact@v7
        with:
          name: duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}
          path: bindings/duckdb-${{ matrix.platform }}-${{ matrix.arch }}-v${{ matrix.node-version }}.node
          retention-days: 90
